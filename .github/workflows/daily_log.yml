name: Daily Projection Log

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet yfinance requests

      - name: Compute and append snapshot
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: python scripts/append_daily_snapshot.py

      - name: Commit log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projection_log.csv
          git diff --quiet --cached || git commit -m "daily snapshot $(date -u +%Y-%m-%d)"
          git push
